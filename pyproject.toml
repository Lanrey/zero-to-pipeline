[project]
name = "zero-to-pipeline"
version = "1.0.0"
description = "Zero to Pipeline: Self-configuring data ingestion framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Olusola Akinsulere", email = "olusola.akinsulere@gmail.com"},
]
keywords = [
    "data-engineering", "etl", "pipeline", "connectors",
    "api", "data-ingestion", "llm", "data-pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.3",
    "keyring>=25.2",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/Lanrey/zero-to-pipeline"
Repository = "https://github.com/Lanrey/zero-to-pipeline"
"Bug Tracker" = "https://github.com/Lanrey/zero-to-pipeline/issues"
Documentation = "https://github.com/Lanrey/zero-to-pipeline/tree/main/docs"
"Release Notes" = "https://github.com/Lanrey/zero-to-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "radon>=6.0",
    "wily>=1.0",
]

[project.scripts]
pipeline = "data_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_pipeline = ["py.typed"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
